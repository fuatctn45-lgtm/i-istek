<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181d"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="yellowGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#facc15" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-opacity="0.4"/>
  
  <!-- Outer Safety Border Accent -->
  <circle cx="256" cy="230" r="148" fill="none" stroke="#27272a" stroke-width="8" stroke-dasharray="14 10"/>
  <circle cx="256" cy="230" r="132" fill="#121216" stroke="url(#goldGrad)" stroke-width="4"/>

  <!-- Industrial Wrench & Screwdriver Crossed in Gold/Yellow -->
  <g filter="url(#yellowGlow)">
    <!-- Wrench (Angled 45 deg) -->
    <path d="M210 276 L170 316 C162 324 150 324 142 316 L134 308 C126 300 126 288 134 280 L174 240 M210 276 L250 236 M270 216 L310 176 C318 168 322 154 316 142 L310 130 C306 122 312 114 320 116 L338 120 C344 122 350 120 354 116 L366 104 C372 98 382 98 388 104 L396 112 C402 118 402 128 396 134 L384 146 C380 150 378 156 380 162 L384 180 C386 188 378 194 370 190 L358 184 C346 178 332 182 324 190 L284 230" 
          fill="none" stroke="url(#goldGrad)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Screwdriver (Opposite 45 deg) -->
    <path d="M140 140 L216 216 M244 244 L340 340 C348 348 348 360 340 368 L328 380 C320 388 308 388 300 380 L204 284"
          fill="none" stroke="url(#goldGrad)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Screwdriver Tip -->
    <path d="M124 124 L144 144" stroke="#ffffff" stroke-width="16" stroke-linecap="round"/>
    <path d="M112 112 L128 128" stroke="url(#goldGrad)" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- Central Gear Core -->
  <circle cx="256" cy="230" r="26" fill="#0a0a0c" stroke="url(#goldGrad)" stroke-width="6"/>

  <!-- AKG Brand Text -->
  <text x="256" y="440" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="52" font-weight="900" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="8">AKG BAKIM</text>
  <text x="256" y="475" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="18" font-weight="700" fill="#a1a1aa" text-anchor="middle" letter-spacing="4">İŞ İSTEK &amp; ARIZA</text>
</svg>
